name: Build desktop applications

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: vsky
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true

      - name: Install build tools
        run: |
          conda run -n vsky python -m pip install pyinstaller
          choco install wixtoolset --yes --no-progress

      - name: Build Windows application
        run: conda run -n vsky python setup.py

      - name: Build MSI installer
        run: |
          $wixBin = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*\bin" -Directory | Select-Object -First 1
          if ($wixBin) { $env:PATH = "$($wixBin.FullName);$env:PATH" }
          conda run -n vsky python build_msi.py

      - name: Create portable ZIP
        run: Compress-Archive -Path dist/vSky -DestinationPath dist/vSky-Windows-x64.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vSky-Windows-x64
          path: |
            dist/vSky-Windows-x64.zip
            dist/*.msi
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon
    runs-on: macos-14
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: vsky
          environment-file: environment_mac.yml
          miniforge-version: latest
          use-mamba: true

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install build tools
        run: python -m pip install pyinstaller

      - name: Build macOS application
        run: python setup.py

      - name: Create application ZIP
        run: ditto -c -k --sequesterRsrc --keepParent dist/vSky.app dist/vSky-macOS-Apple-Silicon.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: vSky-macOS-Apple-Silicon
          path: dist/vSky-macOS-Apple-Silicon.zip
          if-no-files-found: error
