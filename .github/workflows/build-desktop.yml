name: Build desktop applications

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: vsky
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true

      - name: Install build tools
        run: |
          conda run -n vsky python -m pip install pyinstaller
          choco install wixtoolset --yes --no-progress

      - name: Build Windows application
        run: conda run -n vsky python setup.py

      - name: Test Windows application
        run: dist/vSky2/vSky2.exe --smoke-test

      - name: Build MSI installer
        run: |
          $wixBin = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*\bin" -Directory | Select-Object -First 1
          if ($wixBin) { $env:PATH = "$($wixBin.FullName);$env:PATH" }
          conda run -n vsky python build_msi.py

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: vSky2-Windows-x64
          path: dist/vSky-2.0.0.msi
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon
    runs-on: macos-14
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: vsky
          environment-file: environment_mac.yml
          miniforge-version: latest
          use-mamba: true

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install build tools
        run: python -m pip install pyinstaller

      - name: Build macOS application
        run: python setup.py

      - name: Test macOS application
        run: dist/vSky2.app/Contents/MacOS/vSky2 --smoke-test

      - name: Create DMG
        run: |
          mkdir -p dist/dmg
          cp -R dist/vSky2.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname vSky2 -srcfolder dist/dmg -ov -format UDZO dist/vSky2-macOS-Apple-Silicon.dmg

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: vSky2-macOS-Apple-Silicon
          path: dist/vSky2-macOS-Apple-Silicon.dmg
          if-no-files-found: error
